<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Setlist Queue</title>
<style>
  :root {
    --bg: #121316;
    --surface: #1b1d22;
    --surface-hover: #252830;
    --border: #2c303a;
    --text: #f1f3f5;
    --text-dim: #8b92a0;
    --accent: #3b82f6;
    --active-bg: #1e3a8a;
    --active-border: #60a5fa;
  }
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    gap: 8px;
    flex-shrink: 0;
  }
  .header-left {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
    flex: 1;
  }
  .setlist-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-dim);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    letter-spacing: 0.4px;
    text-transform: uppercase;
  }
  .header-actions {
    display: flex;
    gap: 6px;
    flex-shrink: 0;
  }
  button.icon-btn {
    background: var(--surface-hover);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 5px 9px;
    font-size: 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    transition: background 0.15s, border-color 0.15s;
  }
  button.icon-btn:hover {
    background: #2f333d;
    border-color: #4b5563;
  }
  button.icon-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  button.search-trigger {
    padding: 5px 8px;
    font-size: 14px;
    flex-shrink: 0;
  }
  #globalPanel {
    display: none;
    background: #17191e;
    border-bottom: 1px solid var(--border);
    padding: 12px 14px;
    flex-direction: column;
    gap: 10px;
    flex-shrink: 0;
  }
  #globalPanel.open {
    display: flex;
  }
  .control-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    font-size: 12px;
  }
  .control-row label {
    color: var(--text-dim);
    min-width: 75px;
  }
  .control-row select,
  .control-row input[type="range"] {
    flex: 1;
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 4px 6px;
    font-size: 12px;
  }
  .size-badge {
    min-width: 34px;
    text-align: right;
    font-variant-numeric: tabular-nums;
    color: var(--text);
    font-weight: 600;
  }
  #songList {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    outline: none;
  }
  #songList::-webkit-scrollbar {
    width: 7px;
  }
  #songList::-webkit-scrollbar-thumb {
    background: #2f333d;
    border-radius: 4px;
  }
  .song-item {
    display: flex;
    align-items: center;
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 5px solid transparent;
    border-radius: 7px;
    padding: 8px 10px;
    cursor: pointer;
    transition: transform 0.08s, background 0.12s, border-color 0.12s;
    gap: 8px;
    position: relative;
  }
  .song-item:hover {
    background: var(--surface-hover);
  }
  .song-item.current {
    background: var(--active-bg);
    border-color: var(--active-border);
    box-shadow: 0 0 0 1px rgba(96, 165, 250, 0.3);
  }
  .song-item.dragging {
    opacity: 0.45;
  }
  .song-item.drag-over {
    border-top: 2px solid var(--accent);
  }
  .drag-handle {
    color: var(--text-dim);
    cursor: grab;
    font-size: 14px;
    padding: 2px 4px;
    opacity: 0.6;
  }
  .drag-handle:hover {
    opacity: 1;
  }
  .song-num {
    font-size: 11px;
    font-weight: 700;
    color: var(--text-dim);
    min-width: 22px;
    font-variant-numeric: tabular-nums;
  }
  .song-item.current .song-num {
    color: #93c5fd;
  }
  .song-main {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 7px;
  }
  .song-name {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    line-height: 1.25;
  }
  .inline-parts {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 2px;
  }
  .part-chip {
    background: rgba(0, 0, 0, 0.38);
    border: 1px solid rgba(255, 255, 255, 0.25);
    color: #f1f5f9;
    border-radius: 6px;
    padding: 6px 12px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.12s, border-color 0.12s, transform 0.08s;
  }
  .part-chip:hover {
    background: rgba(59, 130, 246, 0.48);
    border-color: #93c5fd;
    color: #fff;
  }
  .part-chip.active {
    background: #3b82f6;
    border-color: #bfdbfe;
    color: #fff;
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.45);
  }
  .song-edit-btn {
    display: none;
    background: rgba(0, 0, 0, 0.45);
    border: 1px solid rgba(255, 255, 255, 0.25);
    color: #fff;
    border-radius: 5px;
    padding: 3px 7px;
    font-size: 11px;
    cursor: pointer;
  }
  body.edit-mode .song-edit-btn {
    display: inline-block;
  }
  #partsMenu {
    position: fixed;
    display: none;
    background: #1f2229;
    border: 1px solid #3f4654;
    border-radius: 8px;
    box-shadow: 0 10px 28px rgba(0, 0, 0, 0.65);
    min-width: 200px;
    max-width: 290px;
    z-index: 1000;
    padding: 6px;
    flex-direction: column;
    gap: 3px;
  }
  #partsMenu.open {
    display: flex;
  }
  .parts-header {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    color: var(--text-dim);
    padding: 5px 8px 5px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .part-option {
    background: transparent;
    border: none;
    color: var(--text);
    text-align: left;
    padding: 8px 11px;
    border-radius: 5px;
    font-size: 15px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .part-option:hover {
    background: var(--accent);
    color: #fff;
  }
  .part-option.active-part {
    background: rgba(59, 130, 246, 0.22);
    color: #93c5fd;
    font-weight: 600;
  }
  #songModalBackdrop,
  #searchModalBackdrop {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.72);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1100;
    padding: 12px;
  }
  #songModalBackdrop.open,
  #searchModalBackdrop.open {
    display: flex;
  }
  .modal-card {
    background: #1b1d22;
    border: 1px solid #374151;
    border-radius: 10px;
    width: 100%;
    max-width: 340px;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 11px;
    box-shadow: 0 16px 36px rgba(0, 0, 0, 0.7);
  }
  .search-card {
    background: #181a1f;
    border: 1px solid #3f4654;
    border-radius: 12px;
    width: 100%;
    max-width: 430px;
    max-height: 94vh;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    box-shadow: 0 20px 44px rgba(0, 0, 0, 0.8);
  }
  .search-top {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  #searchInput {
    flex: 1;
    background: #111317;
    color: #fff;
    border: 1px solid #4b5563;
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 16px;
    outline: none;
    user-select: text;
  }
  #searchInput:focus {
    border-color: var(--accent);
  }
  #searchResults {
    max-height: 185px;
    min-height: 80px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 5px;
    background: #121316;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px;
  }
  #searchResults::-webkit-scrollbar {
    width: 6px;
  }
  #searchResults::-webkit-scrollbar-thumb {
    background: #2f333d;
    border-radius: 4px;
  }
  .search-result-item {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 9px 11px;
    color: var(--text);
    font-size: 15px;
    text-align: left;
    cursor: pointer;
  }
  .search-result-item:hover,
  .search-result-item:active {
    background: var(--accent);
    border-color: #60a5fa;
    color: #fff;
  }
  .search-result-num {
    font-size: 12px;
    font-weight: 700;
    color: var(--text-dim);
    min-width: 22px;
  }
  .search-result-item:hover .search-result-num {
    color: #dbeafe;
  }
  .vk-board {
    display: flex;
    flex-direction: column;
    gap: 5px;
    background: #121316;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 7px;
  }
  .vk-row {
    display: flex;
    gap: 4px;
    justify-content: center;
  }
  .vk-key {
    flex: 1;
    min-width: 0;
    height: 38px;
    background: #252830;
    color: #f8fafc;
    border: 1px solid #374151;
    border-radius: 6px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: manipulation;
  }
  .vk-key:active {
    background: var(--accent);
    border-color: #93c5fd;
    transform: scale(0.96);
  }
  .vk-key.wide {
    flex: 1.7;
    font-size: 13px;
    background: #2c303a;
  }
  .vk-key.space {
    flex: 3.5;
    font-size: 13px;
  }
  .vk-key.danger {
    flex: 1.5;
    font-size: 13px;
    background: #3f1d24;
    border-color: #7f1d1d;
    color: #fecaca;
  }
  .modal-title {
    font-size: 13px;
    font-weight: 700;
    color: #fff;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .swatches {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
.swatch {
width: 22px;
height: 22px;
border-radius: 5px;
border: 2px solid rgba(255, 255, 255, 0.2);
cursor: pointer;
}
.swatch:hover {
transform: scale(1.1);
}
.modal-footer {
display: flex;
justify-content: space-between;
gap: 8px;
margin-top: 4px;
}
.btn-secondary {
background: #2c303a;
color: var(--text);
border: none;
border-radius: 6px;
padding: 6px 10px;
font-size: 12px;
cursor: pointer;
}
.btn-primary {
background: var(--accent);
color: #fff;
border: none;
border-radius: 6px;
padding: 6px 14px;
font-size: 12px;
font-weight: 600;
cursor: pointer;
}
.empty-state {
text-align: center;
color: var(--text-dim);
font-size: 13px;
padding: 32px 16px;
}

const FONTS = [
{ label: "Segoe UI (Padrão)", value: "'Segoe UI', system-ui, sans-serif" },
{ label: "Arial", value: "Arial, Helvetica, sans-serif" },
{ label: "Arial Black (Pesada)", value: "'Arial Black', Gadget, sans-serif" },
{ label: "Impact (Condensada Palco)", value: "Impact, Charcoal, sans-serif" },
{ label: "Trebuchet MS", value: "'Trebuchet MS', Helvetica, sans-serif" },
{ label: "Verdana (Larga)", value: "Verdana, Geneva, sans-serif" },
{ label: "Tahoma", value: "Tahoma, Geneva, sans-serif" },
{ label: "Calibri", value: "Calibri, Candara, sans-serif" },
{ label: "Century Gothic", value: "'Century Gothic', AppleGothic, sans-serif" },
{ label: "Georgia (Serif)", value: "Georgia, serif" },
{ label: "Times New Roman", value: "'Times New Roman', Times, serif" },
{ label: "Consolas (Monoespaçada)", value: "Consolas, monospace" },
{ label: "Courier New", value: "'Courier New', Courier, monospace" },
{ label: "Lucida Console", value: "'Lucida Console', Monaco, monospace" }
];
const SWATCH_COLORS = [
"#1b1d22", "#1e3a8a", "#065f46", "#7f1d1d",
"#78350f", "#581c87", "#831843", "#1e293b",
"#0f766e", "#b45309", "#3730a3", "#3f3f46"
];
const VK_ROWS = [
["1", "2", "3", "4", "5", "6", "7", "8", "9", "0"],
["Q", "W", "E", "R", "T", "Y", "U", "I", "O", "P"],
["A", "S", "D", "F", "G", "H", "J", "K", "L"],
["Z", "X", "C", "V", "B", "N", "M", "-", "⌫"]
];
let gpState = { setlist: "Setlist", current: -1, currentPart: -1, songs: [] };
let lastStateKey = "";
let isSyncing = false;
let isDragging = false;
let settings = {
globalFont: FONTS.at(0).value,
globalSize: 16,
customOrder: {},
songStyles: {}
};
let editingSongName = null;
let dragSrcIndex = null;
function focusSongList() {
const listEl = document.getElementById("songList");
if (listEl) {
listEl.focus({ preventScroll: true });
}
}
function isAnyModalOpen() {
return document.getElementById("songModalBackdrop").classList.contains("open") ||
document.getElementById("searchModalBackdrop").classList.contains("open");
}
function normalizeText(str) {
return String(str || "")
.normalize("NFD")
.replace(/[\u0300-\u036f]/g, "")
.toLowerCase();
}
function populateFontSelect(selectEl, includeInherit) {
selectEl.innerHTML = "";
if (includeInherit) {
const opt = document.createElement("option");
opt.value = "";
opt.textContent = "Usar fonte padrão";
selectEl.appendChild(opt);
}
FONTS.forEach(f => {
const opt = document.createElement("option");
opt.value = f.value;
opt.textContent = f.label;
opt.style.fontFamily = f.value;
selectEl.appendChild(opt);
});
}
populateFontSelect(document.getElementById("globalFont"), false);
populateFontSelect(document.getElementById("modalFont"), true);
const swatchesEl = document.getElementById("bgSwatches");
SWATCH_COLORS.forEach(hex => {
const btn = document.createElement("button");
btn.type = "button";
btn.className = "swatch";
btn.style.background = hex;
btn.title = hex;
btn.onclick = () => {
document.getElementById("modalBgColor").value = hex;
};
swatchesEl.appendChild(btn);
});
function buildVirtualKeyboard() {
const board = document.getElementById("virtualKeyboard");
board.innerHTML = "";
const inputEl = document.getElementById("searchInput");
VK_ROWS.forEach(rowKeys => {
const rowEl = document.createElement("div");
rowEl.className = "vk-row";
rowKeys.forEach(k => {
const keyBtn = document.createElement("button");
keyBtn.type = "button";
keyBtn.className = "vk-key" + (k === "⌫" ? " wide" : "");
keyBtn.textContent = k;
keyBtn.onclick = (e) => {
e.preventDefault();
if (k === "⌫") {
inputEl.value = inputEl.value.slice(0, -1);
} else {
inputEl.value += k.toLowerCase();
}
renderSearchResults();
};
rowEl.appendChild(keyBtn);
});
board.appendChild(rowEl);
});
const bottomRow = document.createElement("div");
bottomRow.className = "vk-row";
const clearBtn = document.createElement("button");
clearBtn.type = "button";
clearBtn.className = "vk-key danger";
clearBtn.textContent = "Limpar";
clearBtn.onclick = (e) => {
e.preventDefault();
inputEl.value = "";
renderSearchResults();
};
const spaceBtn = document.createElement("button");
spaceBtn.type = "button";
spaceBtn.className = "vk-key space";
spaceBtn.textContent = "Espaço";
spaceBtn.onclick = (e) => {
e.preventDefault();
inputEl.value += " ";
renderSearchResults();
};
const doneBtn = document.createElement("button");
doneBtn.type = "button";
doneBtn.className = "vk-key wide";
doneBtn.textContent = "Fechar";
doneBtn.onclick = (e) => {
e.preventDefault();
closeSearchModal();
};
bottomRow.appendChild(clearBtn);
bottomRow.appendChild(spaceBtn);
bottomRow.appendChild(doneBtn);
board.appendChild(bottomRow);
}
buildVirtualKeyboard();
function openSearchModal() {
closePartsMenu();
const inputEl = document.getElementById("searchInput");
inputEl.value = "";
document.getElementById("searchModalBackdrop").classList.add("open");
renderSearchResults();
setTimeout(() => inputEl.focus(), 30);
}
function closeSearchModal() {
document.getElementById("searchModalBackdrop").classList.remove("open");
focusSongList();
}
function renderSearchResults() {
const resultsEl = document.getElementById("searchResults");
const query = normalizeText(document.getElementById("searchInput").value).trim();
resultsEl.innerHTML = "";
const ordered = getOrderedSongs();
const matches = ordered
.map((song, visualIdx) => ({ song, visualIdx }))
.filter(entry => !query || normalizeText(entry.song.n).includes(query));
if (matches.length === 0) {
resultsEl.innerHTML = 'Nenhuma música encontrada.';
return;
}
matches.forEach(entry => {
const btn = document.createElement("button");
btn.type = "button";
btn.className = "search-result-item";
const numSpan = document.createElement("span");
numSpan.className = "search-result-num";
numSpan.textContent = String(entry.visualIdx + 1).padStart(2, "0");
const nameSpan = document.createElement("span");
nameSpan.textContent = entry.song.n;
btn.appendChild(numSpan);
btn.appendChild(nameSpan);
btn.onclick = () => {
closeSearchModal();
if (window.gp_selectSong) {
window.gp_selectSong(entry.song.i);
setTimeout(syncFromGP, 60);
}
};
resultsEl.appendChild(btn);
});
}
document.getElementById("btnSearch").onclick = (e) => {
e.stopPropagation();
openSearchModal();
};
document.getElementById("btnCloseSearch").onclick = closeSearchModal;
document.getElementById("searchModalBackdrop").onclick = (e) => {
if (e.target === document.getElementById("searchModalBackdrop")) {
closeSearchModal();
}
};
document.getElementById("searchInput").oninput = renderSearchResults;
function saveSettings() {
if (window.gp_saveSettings) {
window.gp_saveSettings(JSON.stringify(settings));
}
}
function applyStateObject(parsed) {
if (!parsed || typeof parsed !== "object") return;
const pendingStep = Number(parsed.step) || 0;
const stateKey = JSON.stringify({
setlist: parsed.setlist,
current: parsed.current,
currentPart: parsed.currentPart,
songs: parsed.songs
});
if (stateKey !== lastStateKey) {
lastStateKey = stateKey;
gpState = parsed;
render();
}
if (pendingStep !== 0) {
stepSong(pendingStep);
}
}
async function syncFromGP() {
if (isSyncing || isDragging || !window.gp_getState) return;
isSyncing = true;
try {
const rawState = await window.gp_getState();
if (rawState) {
applyStateObject(JSON.parse(rawState));
}
} catch (e) {
} finally {
isSyncing = false;
}
}
async function loadInitialData() {
try {
if (window.gp_loadSettings) {
const raw = await window.gp_loadSettings();
if (raw) {
const parsed = JSON.parse(raw);
settings = {
globalFont: parsed.globalFont || FONTS.at(0).value,
globalSize: Math.max(8, Math.min(42, Number(parsed.globalSize) || 16)),
customOrder: parsed.customOrder || {},
songStyles: parsed.songStyles || {}
};
}
}
} catch (e) {}
document.getElementById("globalFont").value = settings.globalFont;
document.getElementById("globalSize").value = settings.globalSize;
document.getElementById("globalSizeVal").textContent = settings.globalSize + "px";
await syncFromGP();
render();
focusSongList();
setInterval(syncFromGP, 150);
}
window.gpPush = function(newState) {
applyStateObject(newState);
};
function getOrderedSongs() {
const songs = gpState.songs || [];
const key = gpState.setlist || "default";
const savedNames = settings.customOrder.hasOwnProperty(key) ? settings.customOrder.valueOf()[key] : null;
if (!Array.isArray(savedNames) || savedNames.length === 0) {
return songs;
}
const remaining = [...songs];
const ordered = [];
savedNames.forEach(name => {
const foundIdx = remaining.findIndex(s => s.n === name);
if (foundIdx !== -1) {
ordered.push(remaining.splice(foundIdx, 1).at(0));
}
});
return ordered.concat(remaining);
}
function stepSong(delta) {
const ordered = getOrderedSongs();
if (ordered.length === 0) return;
const currentVisualIdx = ordered.findIndex(s => s.i === gpState.current);
let targetVisualIdx = 0;
if (currentVisualIdx === -1) {
targetVisualIdx = delta > 0 ? 0 : ordered.length - 1;
} else {
targetVisualIdx = Math.max(0, Math.min(ordered.length - 1, currentVisualIdx + delta));
}
const targetSong = ordered.at(targetVisualIdx);
if (targetSong && window.gp_selectSong) {
closePartsMenu();
window.gp_selectSong(targetSong.i);
setTimeout(syncFromGP, 60);
}
}
window.addEventListener("keydown", (e) => {
if (e.key === "Escape") {
if (document.getElementById("searchModalBackdrop").classList.contains("open")) {
closeSearchModal();
return;
}
closePartsMenu();
return;
}
const tag = (e.target && e.target.tagName) ? e.target.tagName.toUpperCase() : "";
if (isAnyModalOpen() || tag === "SELECT" || tag === "INPUT") {
return;
}
if (e.key === "ArrowDown" || e.key === "PageDown") {
e.preventDefault();
e.stopPropagation();
stepSong(1);
} else if (e.key === "ArrowUp" || e.key === "PageUp") {
e.preventDefault();
e.stopPropagation();
stepSong(-1);
}
}, true);
window.addEventListener("focus", () => {
if (!isAnyModalOpen()) {
focusSongList();
}
});
function render() {
document.getElementById("setlistTitle").textContent = gpState.setlist || "Setlist";
const listEl = document.getElementById("songList");
listEl.innerHTML = "";
const ordered = getOrderedSongs();
if (ordered.length === 0) {
listEl.innerHTML = 'Nenhuma música encontrada no setlist atual do Gig Performer.';
return;
}
let currentItemEl = null;
ordered.forEach((song, visualIdx) => {
const isCurrent = song.i === gpState.current;
const st = Object.prototype.hasOwnProperty.call(settings.songStyles, song.n)
? Reflect.get(settings.songStyles, song.n)
: {};
const item = document.createElement("div");
item.className = "song-item" + (isCurrent ? " current" : "");
item.draggable = true;
item.dataset.visualIdx = visualIdx;
if (isCurrent) {
currentItemEl = item;
}
if (st.bg) {
item.style.background = st.bg;
}
if (st.color) {
item.style.color = st.color;
item.style.borderLeftColor = st.color;
}
const handle = document.createElement("span");
handle.className = "drag-handle";
handle.textContent = "⋮⋮";
handle.title = "Arrastar para reordenar";
const num = document.createElement("span");
num.className = "song-num";
num.textContent = String(visualIdx + 1).padStart(2, "0");
const main = document.createElement("div");
main.className = "song-main";
const nameEl = document.createElement("div");
nameEl.className = "song-name";
nameEl.textContent = song.n;
nameEl.style.fontFamily = st.font || settings.globalFont;
nameEl.style.fontSize = (st.size || settings.globalSize) + "px";
main.appendChild(nameEl);
if (isCurrent && Array.isArray(song.parts) && song.parts.length > 1) {
const partsRow = document.createElement("div");
partsRow.className = "inline-parts";
song.parts.forEach(p => {
const chip = document.createElement("button");
chip.type = "button";
const isPartActive = (p.i === gpState.currentPart);
chip.className = "part-chip" + (isPartActive ? " active" : "");
chip.textContent = p.n;
chip.onclick = (e) => {
e.stopPropagation();
chip.blur();
closePartsMenu();
focusSongList();
if (window.gp_selectSongPart) {
window.gp_selectSongPart([song.i, p.i]);
setTimeout(syncFromGP, 60);
}
};
partsRow.appendChild(chip);
});
main.appendChild(partsRow);
}
const editBtn = document.createElement("button");
editBtn.type = "button";
editBtn.className = "song-edit-btn";
editBtn.textContent = "🎨";
editBtn.title = "Cor e fonte desta música";
editBtn.onclick = (e) => {
e.stopPropagation();
openSongModal(song.n);
};
item.appendChild(handle);
item.appendChild(num);
item.appendChild(main);
item.appendChild(editBtn);
item.onclick = () => {
closePartsMenu();
focusSongList();
if (window.gp_selectSong) {
window.gp_selectSong(song.i);
setTimeout(syncFromGP, 60);
}
};
item.oncontextmenu = (e) => {
e.preventDefault();
e.stopPropagation();
openPartsMenu(e.clientX, e.clientY, song);
};
item.ondragstart = (e) => {
isDragging = true;
dragSrcIndex = visualIdx;
item.classList.add("dragging");
e.dataTransfer.effectAllowed = "move";
};
item.ondragend = () => {
isDragging = false;
item.classList.remove("dragging");
document.querySelectorAll(".song-item").forEach(el => el.classList.remove("drag-over"));
};
item.ondragover = (e) => {
e.preventDefault();
item.classList.add("drag-over");
};
item.ondragleave = () => {
item.classList.remove("drag-over");
};
item.ondrop = (e) => {
e.preventDefault();
isDragging = false;
item.classList.remove("drag-over");
if (dragSrcIndex === null || dragSrcIndex === visualIdx) return;
const currentList = getOrderedSongs();
const moved = currentList.splice(dragSrcIndex, 1).at(0);
currentList.splice(visualIdx, 0, moved);
const key = gpState.setlist || "default";
Reflect.set(settings.customOrder, key, currentList.map(s => s.n));
saveSettings();
render();
};
listEl.appendChild(item);
});
if (currentItemEl) {
currentItemEl.scrollIntoView({ block: "nearest", behavior: "smooth" });
}
}
function openPartsMenu(x, y, song) {
const menu = document.getElementById("partsMenu");
menu.innerHTML = "";
const header = document.createElement("div");
header.className = "parts-header";
header.textContent = "Song Parts — " + song.n;
menu.appendChild(header);
const parts = song.parts || [];
if (parts.length === 0) {
const empty = document.createElement("div");
empty.style.padding = "8px 10px";
empty.style.fontSize = "12px";
empty.style.color = "#8b92a0";
empty.textContent = "Nenhuma Song Part cadastrada";
menu.appendChild(empty);
} else {
parts.forEach(p => {
const btn = document.createElement("button");
btn.type = "button";
const isCurrentPart = (song.i === gpState.current && p.i === gpState.currentPart);
btn.className = "part-option" + (isCurrentPart ? " active-part" : "");
btn.textContent = p.n;
btn.onclick = (e) => {
e.stopPropagation();
closePartsMenu();
focusSongList();
if (window.gp_selectSongPart) {
window.gp_selectSongPart([song.i, p.i]);
setTimeout(syncFromGP, 60);
} else if (window.gp_selectSong) {
window.gp_selectSong(song.i);
setTimeout(syncFromGP, 60);
}
};
menu.appendChild(btn);
});
}
menu.classList.add("open");
const rect = menu.getBoundingClientRect();
const posX = Math.min(x, window.innerWidth - rect.width - 8);
const posY = Math.min(y, window.innerHeight - rect.height - 8);
menu.style.left = Math.max(8, posX) + "px";
menu.style.top = Math.max(8, posY) + "px";
}
function closePartsMenu() {
document.getElementById("partsMenu").classList.remove("open");
}
document.addEventListener("click", closePartsMenu);
window.addEventListener("blur", closePartsMenu);
const btnPalette = document.getElementById("btnPalette");
const globalPanel = document.getElementById("globalPanel");
btnPalette.onclick = () => {
const isOpen = globalPanel.classList.toggle("open");
btnPalette.classList.toggle("active", isOpen);
document.body.classList.toggle("edit-mode", isOpen);
};
document.getElementById("globalFont").onchange = (e) => {
settings.globalFont = e.target.value;
saveSettings();
render();
};
document.getElementById("globalSize").oninput = (e) => {
const val = Math.max(8, Math.min(42, Number(e.target.value) || 16));
settings.globalSize = val;
document.getElementById("globalSizeVal").textContent = val + "px";
saveSettings();
render();
};
document.getElementById("btnResetOrder").onclick = () => {
const key = gpState.setlist || "default";
Reflect.deleteProperty(settings.customOrder, key);
saveSettings();
render();
};
document.getElementById("btnResetStyles").onclick = () => {
settings.songStyles = {};
saveSettings();
render();
};
function openSongModal(songName) {
editingSongName = songName;
const st = Object.prototype.hasOwnProperty.call(settings.songStyles, songName)
? Reflect.get(settings.songStyles, songName)
: {};
document.getElementById("modalSongTitle").textContent = songName;
document.getElementById("modalTextColor").value = st.color || "#f1f3f5";
document.getElementById("modalBgColor").value = st.bg || "#1b1d22";
document.getElementById("modalFont").value = st.font || "";
const sz = st.size || settings.globalSize;
document.getElementById("modalSize").value = sz;
document.getElementById("modalSizeVal").textContent = st.size ? (st.size + "px") : "Padrão";
document.getElementById("songModalBackdrop").classList.add("open");
}
document.getElementById("modalSize").oninput = (e) => {
document.getElementById("modalSizeVal").textContent = e.target.value + "px";
};
document.getElementById("btnModalCancel").onclick = () => {
document.getElementById("songModalBackdrop").classList.remove("open");
focusSongList();
};
document.getElementById("btnModalClear").onclick = () => {
if (editingSongName) {
Reflect.deleteProperty(settings.songStyles, editingSongName);
saveSettings();
render();
}
document.getElementById("songModalBackdrop").classList.remove("open");
focusSongList();
};
document.getElementById("btnModalSave").onclick = () => {
if (editingSongName) {
const color = document.getElementById("modalTextColor").value;
const bg = document.getElementById("modalBgColor").value;
const font = document.getElementById("modalFont").value;
const size = Math.max(8, Math.min(42, Number(document.getElementById("modalSize").value) || 16));
Reflect.set(settings.songStyles, editingSongName, {
color: color !== "#f1f3f5" ? color : "",
bg: bg !== "#1b1d22" ? bg : "",
font: font || "",
size: size
});
saveSettings();
render();
}
document.getElementById("songModalBackdrop").classList.remove("open");
focusSongList();
};
loadInitialData();
  </script>
</body>
</html>
