<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Setlist Queue</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;user-select:none}
  body{background:#121316;color:#f1f3f5;font-family:'Segoe UI',system-ui,sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}
  header{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:#1b1d22;border-bottom:1px solid #2c303a;gap:8px;flex-shrink:0}
  .h-left{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
  .title{font-size:13px;font-weight:600;color:#8b92a0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase}
  .h-act{display:flex;align-items:center;gap:6px;flex-shrink:0}
  .clock{font-size:18px;font-weight:800;color:#ffffff;background:#7f1d1d;border:1px solid #b91c1c;border-radius:6px;padding:3px 10px;font-variant-numeric:tabular-nums;letter-spacing:0.6px;line-height:1.15}
  button.btn{background:#252830;color:#f1f3f5;border:1px solid #2c303a;border-radius:6px;padding:5px 9px;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px}
  button.btn:hover{background:#2f333d}
  button.btn.active{background:#3b82f6;border-color:#3b82f6;color:#fff}
  #globalPanel{display:none;background:#17191e;border-bottom:1px solid #2c303a;padding:10px 12px;flex-direction:column;gap:8px;flex-shrink:0}
  #globalPanel.open{display:flex}
  .row{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px}
  .row label{color:#8b92a0;min-width:68px}
  .row select,.row input[type=range]{flex:1;background:#1b1d22;color:#f1f3f5;border:1px solid #2c303a;border-radius:5px;padding:4px;font-size:12px}
  #songList{flex:1;overflow-y:auto;padding:10px;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));align-content:start;gap:8px;outline:none}
  #songList::-webkit-scrollbar{width:7px}
  #songList::-webkit-scrollbar-thumb{background:#2f333d;border-radius:4px}
  .song{display:flex;align-items:center;background:#1b1d22;border:1px solid #2c303a;border-left:5px solid transparent;border-radius:8px;padding:10px 11px;cursor:pointer;gap:8px;min-width:0;min-height:48px;touch-action:manipulation}
  .song:hover{background:#252830}
  .song.current{background:#1e3a8a;border-color:#60a5fa;box-shadow:0 0 0 1px rgba(96,165,250,.3)}
  .song.drag-over{outline:2px dashed #3b82f6;outline-offset:-2px}
  .grip{color:#8b92a0;cursor:grab;font-size:14px;padding:2px;flex-shrink:0}
  .num{font-size:11px;font-weight:700;color:#8b92a0;min-width:22px;flex-shrink:0}
  .song.current .num{color:#93c5fd}
  .smain{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
  .sname{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.25}
  .parts{display:flex;flex-wrap:wrap;gap:6px}
  .chip{background:rgba(0,0,0,.38);border:1px solid rgba(255,255,255,.25);color:#f1f5f9;border-radius:6px;padding:6px 12px;font-size:14px;font-weight:600;cursor:pointer}
  .chip:hover{background:rgba(59,130,246,.48);border-color:#93c5fd}
  .chip.active{background:#3b82f6;border-color:#bfdbfe;color:#fff}
  .sedit{display:none;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:5px;padding:3px 7px;font-size:11px;cursor:pointer;flex-shrink:0}
  body.edit-mode .sedit{display:inline-block}
  #partsMenu{position:fixed;display:none;background:#1f2229;border:1px solid #3f4654;border-radius:8px;box-shadow:0 10px 28px rgba(0,0,0,.65);min-width:200px;z-index:1000;padding:6px;flex-direction:column;gap:3px}
  #partsMenu.open{display:flex}
  .phead{font-size:11px;font-weight:700;color:#8b92a0;padding:4px 8px;border-bottom:1px solid #2c303a}
  .popt{background:transparent;border:none;color:#f1f3f5;text-align:left;padding:8px 10px;border-radius:5px;font-size:15px;cursor:pointer}
  .popt:hover{background:#3b82f6;color:#fff}
  .backdrop{position:fixed;inset:0;background:rgba(0,0,0,.74);display:none;align-items:center;justify-content:center;z-index:1100;padding:12px}
  .backdrop.open{display:flex}
  .card{background:#1b1d22;border:1px solid #374151;border-radius:10px;width:100%;max-width:410px;padding:12px;display:flex;flex-direction:column;gap:10px}
  #searchInput{flex:1;background:#111317;color:#fff;border:1px solid #4b5563;border-radius:7px;padding:9px 11px;font-size:16px;outline:none;user-select:text}
  #searchResults{max-height:175px;min-height:70px;overflow-y:auto;display:flex;flex-direction:column;gap:4px;background:#121316;border:1px solid #2c303a;border-radius:7px;padding:6px}
  .sres{display:flex;align-items:center;gap:8px;background:#1b1d22;border:1px solid #2c303a;border-radius:6px;padding:8px 10px;color:#f1f3f5;font-size:15px;text-align:left;cursor:pointer}
  .sres:hover{background:#3b82f6;color:#fff}
  .vk{display:flex;flex-direction:column;gap:4px;background:#121316;border:1px solid #2c303a;border-radius:7px;padding:6px}
  .vkr{display:flex;gap:4px}
  .vkk{flex:1;height:36px;background:#252830;color:#fff;border:1px solid #374151;border-radius:5px;font-size:14px;font-weight:600;cursor:pointer}
  .vkk:active{background:#3b82f6}
  .swatches{display:flex;flex-wrap:wrap;gap:6px}
  .sw{width:22px;height:22px;border-radius:5px;border:2px solid rgba(255,255,255,.2);cursor:pointer}
  .empty{grid-column:1/-1;text-align:center;color:#8b92a0;font-size:13px;padding:28px 12px}
</style>
</head>
<body>
<header>
  <div class="h-left">
    <button class="btn" id="btnSearch" title="Buscar música" style="font-size:14px;padding:5px 8px">🔍</button>
    <div class="title" id="setlistTitle">Setlist</div>
  </div>
  <div class="h-act">
    <div class="clock" id="clockDisplay">00:00</div>
    <button class="btn" id="btnResetOrder">↺ Ordem</button>
    <button class="btn" id="btnPalette">🎨 Estilo</button>
  </div>
</header>
<section id="globalPanel">
  <div class="row"><label>Fonte</label><select id="globalFont"></select></div>
  <div class="row"><label>Tamanho</label><input type="range" id="globalSize" min="8" max="42" value="16"><span id="globalSizeVal">16px</span></div>
  <div class="row" style="justify-content:flex-end"><button class="btn" id="btnResetStyles">Limpar estilos individuais</button></div>
</section>
<main id="songList" tabindex="0"><div class="empty">Carregando músicas do Gig Performer...</div></main>
<div id="partsMenu"></div>
<div class="backdrop" id="searchModal">
  <div class="card">
    <div class="row"><input type="text" id="searchInput" placeholder="Buscar música..."><button class="btn" id="btnCloseSearch">✕</button></div>
    <div id="searchResults"></div>
    <div class="vk" id="vkBoard"></div>
  </div>
</div>
<div class="backdrop" id="songModal">
  <div class="card" style="max-width:330px">
    <div id="modalTitle" style="font-weight:700;font-size:13px">Personalizar Música</div>
    <div class="row"><label>Texto</label><input type="color" id="mColor" value="#f1f3f5"><label style="min-width:auto">Fundo</label><input type="color" id="mBg" value="#1b1d22"></div>
    <div class="swatches" id="swatches"></div>
    <div class="row"><label>Fonte</label><select id="mFont"></select></div>
    <div class="row"><label>Tamanho</label><input type="range" id="mSize" min="8" max="42" value="16"><span id="mSizeVal">Padrão</span></div>
    <div class="row" style="justify-content:space-between;margin-top:4px">
      <button class="btn" id="btnMClear">Padrão</button>
      <div style="display:flex;gap:6px"><button class="btn" id="btnMCancel">Cancelar</button><button class="btn active" id="btnMSave">Salvar</button></div>
    </div>
  </div>
</div>
<script>
const DEF_FONT="'Segoe UI',system-ui,sans-serif";
const FONTS=[
  {l:"Segoe UI",v:DEF_FONT},{l:"Arial",v:"Arial,sans-serif"},{l:"Arial Black",v:"'Arial Black',sans-serif"},
  {l:"Impact",v:"Impact,sans-serif"},{l:"Trebuchet MS",v:"'Trebuchet MS',sans-serif"},{l:"Verdana",v:"Verdana,sans-serif"},
  {l:"Tahoma",v:"Tahoma,sans-serif"},{l:"Calibri",v:"Calibri,sans-serif"},{l:"Century Gothic",v:"'Century Gothic',sans-serif"},
  {l:"Georgia",v:"Georgia,serif"},{l:"Times New Roman",v:"'Times New Roman',serif"},{l:"Consolas",v:"Consolas,monospace"},
  {l:"Courier New",v:"'Courier New',monospace"},{l:"Lucida Console",v:"'Lucida Console',monospace"}
];
const COLORS=["#1b1d22","#1e3a8a","#065f46","#7f1d1d","#78350f","#581c87","#831843","#1e293b","#0f766e","#b45309","#3730a3","#3f3f46"];
const VK=[["1","2","3","4","5","6","7","8","9","0"],["Q","W","E","R","T","Y","U","I","O","P"],["A","S","D","F","G","H","J","K","L"],["Z","X","C","V","B","N","M","-","⌫"]];

let gpState={setlist:"Setlist",current:-1,currentPart:-1,songs:[]};
let settings={globalFont:DEF_FONT,globalSize:16,customOrder:{},songStyles:{}};
let lastKey="",syncing=false,dragging=false,editName=null,dragIdx=null;

function el(id){return document.getElementById(id)}
function at(a,i){return Array.isArray(a)&&i>=0&&i<a.length?a.slice(i,i+1).shift():undefined}
function norm(s){return String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase()}
function focusList(){const l=el("songList");if(l)l.focus({preventScroll:true})}

function updateClock(){
  const c=el("clockDisplay");if(!c)return;
  const now=new Date();
  const hh=String(now.getHours()).padStart(2,"0");
  const mm=String(now.getMinutes()).padStart(2,"0");
  c.textContent=hh+":"+mm;
}
updateClock();
setInterval(updateClock,1000);

function fillFonts(sel,inh){
  sel.innerHTML="";
  if(inh){const o=document.createElement("option");o.value="";o.textContent="Usar fonte padrão";sel.appendChild(o)}
  FONTS.forEach(f=>{const o=document.createElement("option");o.value=f.v;o.textContent=f.l;o.style.fontFamily=f.v;sel.appendChild(o)});
}
fillFonts(el("globalFont"),false);
fillFonts(el("mFont"),true);

COLORS.forEach(h=>{
  const b=document.createElement("button");b.type="button";b.className="sw";b.style.background=h;
  b.onclick=()=>{el("mBg").value=h};el("swatches").appendChild(b);
});

(function buildVK(){
const bd=el("vkBoard"),inp=el("searchInput");
VK.forEach(r=>{
const d=document.createElement("div");d.className="vkr";
r.forEach(k=>{
const b=document.createElement("button");b.type="button";b.className="vkk";b.textContent=k;
if(k==="⌫")b.style.flex="1.6";
b.onclick=()=>{inp.value=k==="⌫"?inp.value.slice(0,-1):inp.value+k.toLowerCase();renderSearch()};
d.appendChild(b);
});
bd.appendChild(d);
});
const bot=document.createElement("div");bot.className="vkr";
const bClr=document.createElement("button");bClr.type="button";bClr.className="vkk";bClr.textContent="Limpar";bClr.style.flex="1.4";bClr.onclick=()=>{inp.value="";renderSearch()};
const bSpc=document.createElement("button");bSpc.type="button";bSpc.className="vkk";bSpc.textContent="Espaço";bSpc.style.flex="3.2";bSpc.onclick=()=>{inp.value+=" ";renderSearch()};
const bCls=document.createElement("button");bCls.type="button";bCls.className="vkk";bCls.textContent="Fechar";bCls.style.flex="1.4";bCls.onclick=closeSearch;
bot.appendChild(bClr);bot.appendChild(bSpc);bot.appendChild(bCls);bd.appendChild(bot);
})();
function openSearch(){el("partsMenu").classList.remove("open");el("searchInput").value="";el("searchModal").classList.add("open");renderSearch();setTimeout(()=>el("searchInput").focus(),30)}
function closeSearch(){el("searchModal").classList.remove("open");focusList()}
function renderSearch(){
const res=el("searchResults"),q=norm(el("searchInput").value).trim();
res.innerHTML="";
const list=getOrdered().map((s,idx)=>({s,idx})).filter(x=>!q||norm(x.s.n).includes(q));
if(!list.length){res.innerHTML='Nenhuma música encontrada.';return}
list.forEach(x=>{
const b=document.createElement("button");b.type="button";b.className="sres";
b.innerHTML=''+String(x.idx+1).padStart(2,"0")+'';
b.lastChild.textContent=x.s.n;
b.onclick=()=>{closeSearch();if(window.gp_selectSong){window.gp_selectSong(x.s.i);setTimeout(syncGP,60)}};
res.appendChild(b);
});
}
el("btnSearch").onclick=e=>{e.stopPropagation();openSearch()};
el("btnCloseSearch").onclick=closeSearch;
el("searchInput").oninput=renderSearch;
function saveSet(){if(window.gp_saveSettings)window.gp_saveSettings(JSON.stringify(settings))}
function getOrdered(){
const songs=gpState.songs||[],k=gpState.setlist||"default";
const saved=Object.prototype.hasOwnProperty.call(settings.customOrder,k)?Reflect.get(settings.customOrder,k):null;
if(!Array.isArray(saved)||!saved.length)return songs;
const rem=[...songs],ord=[];
saved.forEach(n=>{const idx=rem.findIndex(s=>s.n===n);if(idx!==-1)ord.push(rem.splice(idx,1).shift())});
return ord.concat(rem);
}
function stepSong(d){
const ord=getOrdered();if(!ord.length)return;
const cur=ord.findIndex(s=>s.i===gpState.current);
const tgt=cur===-1?(d>0?0:ord.length-1):Math.max(0,Math.min(ord.length-1,cur+d));
const s=at(ord,tgt);
if(s&&window.gp_selectSong){el("partsMenu").classList.remove("open");window.gp_selectSong(s.i);setTimeout(syncGP,60)}
}
function applyState(p){
if(!p||typeof p!=="object")return;
const stp=Number(p.step)||0;
const k=JSON.stringify({s:p.setlist,c:p.current,p:p.currentPart,l:p.songs});
if(k!==lastKey){lastKey=k;gpState=p;render()}
if(stp!==0)stepSong(stp);
}
window.gpPush=applyState;
async function syncGP(){
if(syncing||dragging||!window.gp_getState)return;
syncing=true;
try{const r=await window.gp_getState();if(r)applyState(JSON.parse(r))}catch(e){}finally{syncing=false}
}
function render(){
el("setlistTitle").textContent=gpState.setlist||"Setlist";
const list=el("songList");list.innerHTML="";
const ord=getOrdered();
if(!ord.length){list.innerHTML='Nenhuma música encontrada no setlist atual do Gig Performer.';return}
let curEl=null;
ord.forEach((song,idx)=>{
const isCur=song.i===gpState.current;
const st=Object.prototype.hasOwnProperty.call(settings.songStyles,song.n)?Reflect.get(settings.songStyles,song.n):{};
const item=document.createElement("div");item.className="song"+(isCur?" current":"");item.draggable=true;
if(isCur)curEl=item;
if(st.bg)item.style.background=st.bg;
if(st.color){item.style.color=st.color;item.style.borderLeftColor=st.color}
const grip=document.createElement("span");grip.className="grip";grip.textContent="⋮⋮";
const num=document.createElement("span");num.className="num";num.textContent=String(idx+1).padStart(2,"0");
const main=document.createElement("div");main.className="smain";
const name=document.createElement("div");name.className="sname";name.textContent=song.n;
name.style.fontFamily=st.font||settings.globalFont;name.style.fontSize=(st.size||settings.globalSize)+"px";
main.appendChild(name);
if(isCur&&Array.isArray(song.parts)&&song.parts.length>1){
const row=document.createElement("div");row.className="parts";
song.parts.forEach(p=>{
const ch=document.createElement("button");ch.type="button";ch.className="chip"+(p.i===gpState.currentPart?" active":"");ch.textContent=p.n;
ch.onclick=e=>{e.stopPropagation();ch.blur();focusList();if(window.gp_selectSongPart){window.gp_selectSongPart([song.i,p.i]);setTimeout(syncGP,60)}};
row.appendChild(ch);
});
main.appendChild(row);
}
const eb=document.createElement("button");eb.type="button";eb.className="sedit";eb.textContent="🎨";
eb.onclick=e=>{e.stopPropagation();openModal(song.n)};
item.appendChild(grip);item.appendChild(num);item.appendChild(main);item.appendChild(eb);
item.onclick=()=>{el("partsMenu").classList.remove("open");focusList();if(window.gp_selectSong){window.gp_selectSong(song.i);setTimeout(syncGP,60)}};
item.oncontextmenu=e=>{e.preventDefault();e.stopPropagation();openParts(e.clientX,e.clientY,song)};
item.ondragstart=e=>{dragging=true;dragIdx=idx;e.dataTransfer.effectAllowed="move"};
item.ondragend=()=>{dragging=false;document.querySelectorAll(".song").forEach(x=>x.classList.remove("drag-over"))};
item.ondragover=e=>{e.preventDefault();item.classList.add("drag-over")};
item.ondragleave=()=>item.classList.remove("drag-over");
item.ondrop=e=>{
e.preventDefault();dragging=false;item.classList.remove("drag-over");
if(dragIdx===null||dragIdx===idx)return;
const curL=getOrdered(),mv=curL.splice(dragIdx,1).shift();curL.splice(idx,0,mv);
Reflect.set(settings.customOrder,gpState.setlist||"default",curL.map(s=>s.n));saveSet();render();
};
list.appendChild(item);
});
if(curEl)curEl.scrollIntoView({block:"nearest",behavior:"smooth"});
}
function openParts(x,y,song){
const m=el("partsMenu");m.innerHTML="";
const h=document.createElement("div");h.className="phead";h.textContent="Song Parts — "+song.n;m.appendChild(h);
(song.parts||[]).forEach(p=>{
const b=document.createElement("button");b.type="button";b.className="popt";b.textContent=p.n;
b.onclick=e=>{e.stopPropagation();m.classList.remove("open");focusList();if(window.gp_selectSongPart){window.gp_selectSongPart([song.i,p.i]);setTimeout(syncGP,60)}};
m.appendChild(b);
});
m.classList.add("open");
m.style.left=Math.max(8,Math.min(x,window.innerWidth-210))+"px";
m.style.top=Math.max(8,Math.min(y,window.innerHeight-200))+"px";
}
document.addEventListener("click",()=>el("partsMenu").classList.remove("open"));
window.addEventListener("keydown",e=>{
if(e.key==="Escape"){closeSearch();el("songModal").classList.remove("open");el("partsMenu").classList.remove("open");return}
if(el("searchModal").classList.contains("open")||el("songModal").classList.contains("open"))return;
const tag=e.target&&e.target.tagName?e.target.tagName.toUpperCase():"";
if(tag==="SELECT"||tag==="INPUT")return;
if(e.key==="ArrowDown"||e.key==="PageDown"){e.preventDefault();stepSong(1)}
else if(e.key==="ArrowUp"||e.key==="PageUp"){e.preventDefault();stepSong(-1)}
},true);
el("btnPalette").onclick=()=>{const o=el("globalPanel").classList.toggle("open");el("btnPalette").classList.toggle("active",o);document.body.classList.toggle("edit-mode",o)};
el("globalFont").onchange=e=>{settings.globalFont=e.target.value;saveSet();render()};
el("globalSize").oninput=e=>{const v=Math.max(8,Math.min(42,Number(e.target.value)||16));settings.globalSize=v;el("globalSizeVal").textContent=v+"px";saveSet();render()};
el("btnResetOrder").onclick=()=>{Reflect.deleteProperty(settings.customOrder,gpState.setlist||"default");saveSet();render()};
el("btnResetStyles").onclick=()=>{settings.songStyles={};saveSet();render()};
function openModal(n){
editName=n;const st=Object.prototype.hasOwnProperty.call(settings.songStyles,n)?Reflect.get(settings.songStyles,n):{};
el("modalTitle").textContent=n;el("mColor").value=st.color||"#f1f3f5";el("mBg").value=st.bg||"#1b1d22";el("mFont").value=st.font||"";
const sz=st.size||settings.globalSize;el("mSize").value=sz;el("mSizeVal").textContent=st.size?st.size+"px":"Padrão";
el("songModal").classList.add("open");
}
el("mSize").oninput=e=>{el("mSizeVal").textContent=e.target.value+"px"};
el("btnMCancel").onclick=()=>{el("songModal").classList.remove("open");focusList()};
el("btnMClear").onclick=()=>{if(editName){Reflect.deleteProperty(settings.songStyles,editName);saveSet();render()}el("songModal").classList.remove("open");focusList()};
el("btnMSave").onclick=()=>{
if(editName){
Reflect.set(settings.songStyles,editName,{color:el("mColor").value!=="#f1f3f5"?el("mColor").value:"",bg:el("mBg").value!=="#1b1d22"?el("mBg").value:"",font:el("mFont").value||"",size:Number(el("mSize").value)||16});
saveSet();render();
}
el("songModal").classList.remove("open");focusList();
};
(async function init(){
try{
if(window.gp_loadSettings){
const r=await window.gp_loadSettings();
if(r){const p=JSON.parse(r);settings={globalFont:p.globalFont||DEF_FONT,globalSize:Number(p.globalSize)||16,customOrder:p.customOrder||{},songStyles:p.songStyles||{}}}
}
}catch(e){}
el("globalFont").value=settings.globalFont;el("globalSize").value=settings.globalSize;el("globalSizeVal").textContent=settings.globalSize+"px";
await syncGP();render();focusList();
setInterval(syncGP,150);
})();
 </script>
</body>
</html>
