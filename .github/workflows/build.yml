name: Build Gig Performer Extension (Windows x64)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-windows:
    name: Windows x64 (MSVC)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Baixar gp-sdk oficial e atualizar versao SDK para GP 5.3+
        shell: pwsh
        run: |
          $repo = "https://github.com" + "/gigperformer/gp-sdk.git"
          git clone --depth 1 $repo gp-sdk
          Get-ChildItem gp-sdk -Recurse -Include entry.cpp,types.h,GigPerformerAPI.h | ForEach-Object {
            $txt = Get-Content $_.FullName -Raw
            $txt = $txt -replace 'GPSDK_VERSION\s+\d+', 'GPSDK_VERSION 53'
            $txt = $txt -replace '(GetGPSDKVersion\s*\([^)]*\)\s*\{\s*return\s+)\d+(\s*;)', '${1}53${2}'
            Set-Content $_.FullName $txt -NoNewline
          }
          Select-String -Path "gp-sdk\**\entry.cpp" -Pattern "GetGPSDKVersion|GPSDK_VERSION"

      - name: Ambiente MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configurar CMake
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Compilar DLL
        run: cmake --build build --config Release --parallel

      - name: Publicar Artifact (DLL)
        uses: actions/upload-artifact@v4
        with:
          name: SetlistQueue-Windows-x64
          path: build/out/SetlistQueue.dll
          if-no-files-found: error
