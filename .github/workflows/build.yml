name: Build Gig Performer Extension (Windows x64)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-windows:
    name: Windows x64 (MSVC)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Baixar gp-sdk oficial e atualizar versao SDK
        shell: pwsh
        run: |
          $repo = "https://github.com" + "/gigperformer/gp-sdk.git"
          git clone --depth 1 $repo gp-sdk
          
          # Atualiza qualquer definicao de GPSDK_VERSION nos headers
          Get-ChildItem gp-sdk -Recurse -Include *.h,*.cpp | ForEach-Object {
            $txt = Get-Content $_.FullName -Raw
            if ($txt -match 'GPSDK_VERSION') {
              $txt = [regex]::Replace($txt, '(#define\s+GPSDK_VERSION\s+)\d+', '${1}53')
              Set-Content $_.FullName $txt -NoNewline
            }
          }

          # Garante que GetGPSDKVersion() em entry.cpp retorne 53 diretamente
          $entryFiles = Get-ChildItem gp-sdk -Recurse -Filter "entry.cpp"
          foreach ($file in $entryFiles) {
            Write-Host "=== entry.cpp ANTES ==="
            Get-Content $file.FullName
            $content = Get-Content $file.FullName -Raw
            $content = [regex]::Replace($content, '(GetGPSDKVersion\s*\([^)]*\)\s*\{)[^}]*(\})', '${1} return 53; ${2}')
            Set-Content $file.FullName $content -NoNewline
            Write-Host "=== entry.cpp DEPOIS ==="
            Get-Content $file.FullName
          }

      - name: Ambiente MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configurar CMake
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Compilar DLL
        run: cmake --build build --config Release --parallel

      - name: Publicar Artifact (DLL)
        uses: actions/upload-artifact@v4
        with:
          name: SetlistQueue-Windows-x64
          path: build/out/SetlistQueue.dll
          if-no-files-found: error
